<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fanusum">
<meta name="theme-color" content="#f7f2ec">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Fanusum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..900,0..100;1,9..144,400..900,0..100&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-fish" viewBox="0 0 24 24"><path d="M2.8 12c2.6-4.4 8.2-5.9 12.6-2.6L20.6 6v12l-5.2-3.4C11 17.9 5.4 16.4 2.8 12z"/><circle cx="7.6" cy="11.2" r="1" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5"/><path d="M10 8h5"/></symbol>
    <symbol id="i-shell" viewBox="0 0 24 24"><path d="M12 20.5 4 11.2a8.6 8.6 0 0 1 16 0z"/><path d="M12 20.5V5.6M12 20.5 8.2 6.6M12 20.5l3.8-13.9M12 20.5 5.4 9M12 20.5 18.6 9"/></symbol>
    <symbol id="i-letter" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="m4 7.5 8 5.5 8-5.5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M6.5 9h11l-1.2 10a2 2 0 0 1-2 1.8H9.7a2 2 0 0 1-2-1.8z"/><path d="M7.5 5.5h9V9h-9z"/><circle cx="10.5" cy="14" r=".9" fill="currentColor" stroke="none"/><circle cx="13.6" cy="16.2" r=".9" fill="currentColor" stroke="none"/><circle cx="12.6" cy="12.6" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3.2s6.2 6.6 6.2 10.9a6.2 6.2 0 0 1-12.4 0C5.8 9.8 12 3.2 12 3.2z"/><path d="M9.2 14.6a2.8 2.8 0 0 0 2.8 2.8"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 21.2c-3.7 0-6-2.5-6-5.6 0-3.8 3.3-5.3 3.8-9.6 2.7 1.7 4.2 4.1 4.2 6.5.8-.6 1.3-1.6 1.5-2.8 1.6 1.4 2.5 3.4 2.5 5.8 0 3.3-2.3 5.7-6 5.7z"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.7l1.4-2h4.8l1.4 2h1.7A2.5 2.5 0 0 1 20 8.5v8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.6"/></symbol>
    <symbol id="i-mirror" viewBox="0 0 24 24"><ellipse cx="12" cy="9" rx="6" ry="7"/><path d="M12 16v5M9.5 21h5"/><path d="M9.2 6.5 11 5"/></symbol>
    <symbol id="i-bubble" viewBox="0 0 24 24"><circle cx="9.5" cy="14" r="5.6"/><circle cx="17.2" cy="7.4" r="3"/><circle cx="18" cy="16.8" r="1.7"/><path d="M7 12.4a2.8 2.8 0 0 1 2.2-1.9"/></symbol>
  </defs>
</svg>

<div id="app">
  <header class="top">
    <div class="who">
      <div class="name" id="hName">Fanusum</div>
      <div class="sub" id="hSub"></div>
    </div>
    <div class="chips">
      <span class="chip" title="Düzenli besleme serisi"><svg class="ic flame"><use href="#i-flame"/></svg><b id="hStreak">0</b></span>
      <span class="chip" title="Kabarcık puanı"><svg class="ic bub"><use href="#i-bubble"/></svg><b id="hPoints">0</b></span>
    </div>
  </header>

  <main id="pages">
    <section class="page active" id="p-fanus">
      <div class="bowlWrap"><canvas id="bowl" aria-label="Fanus"></canvas><button class="fab" id="btnMirror" aria-label="Ayna oyunu"><svg class="ic"><use href="#i-mirror"/></svg></button></div>
      <div class="actions">
        <button class="big feed" id="btnFeed"><i><svg class="ic"><use href="#i-food"/></svg></i><span>Yem ver</span></button>
        <button class="big water" id="btnWater"><i><svg class="ic"><use href="#i-drop"/></svg></i><span>Su değişti</span></button>
      </div>
      <div class="status" id="status"></div>
    </section>
    <section class="page" id="p-gunluk"></section>
    <section class="page" id="p-dekor"></section>
    <section class="page" id="p-notlar"></section>
    <section class="page" id="p-ayar"></section>
  </main>

  <nav class="tabs">
    <span class="tab-ind" id="tabInd"></span>
    <button data-p="fanus" class="on"><svg class="ic"><use href="#i-fish"/></svg>Fanus</button>
    <button data-p="gunluk"><svg class="ic"><use href="#i-book"/></svg>Günlük</button>
    <button data-p="dekor"><svg class="ic"><use href="#i-shell"/></svg>Dekor</button>
    <button data-p="notlar"><svg class="ic"><use href="#i-letter"/></svg>Notlar</button>
    <button data-p="ayar"><svg class="ic"><use href="#i-sliders"/></svg>Ayarlar</button>
  </nav>
</div>

<div id="overlay"></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<input type="file" id="filePhoto" accept="image/*" hidden>
<input type="file" id="fileBackup" accept="application/json,.json" hidden>

<script src="config.js"></script>
<script src="notes.js"></script>
<script src="fish.js"></script>
<script src="sound.js"></script>
<script src="app.js"></script>
</body>
</html>
